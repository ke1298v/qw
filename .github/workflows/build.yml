name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew untap aws/tap || true
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild \
            -project MyLocalApp.xcodeproj \
            -scheme MyLocalApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MyLocalApp.app Payload/
          zip -r MyLocalApp.ipa Payload

      - name: Check IPA
        run: |
          ls -lh MyLocalApp.ipa
          unzip -l MyLocalApp.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyLocalApp-IPA
          path: MyLocalApp.ipa